<!doctype html>
<html lang="en">

      content="Open Legacy OS, the AI operating system for creative professionals."

      content="0; url=https://legacy-os-studio.svenskaxcvi.chatgpt.site/"

      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;

      }

      body {
        min-height: 100vh;

        text-align: center;
        border: 1px solid #9c672f78;
        border-radius: 1rem;
        background: #0a0d0f;
        box-shadow: 0 2rem 6rem #000a;
      }

      .mark {
        color: #c88742;
        font-family: Georgia, serif;
        font-size: 4rem;
      }

      h1 {
        margin: 0.75rem 0;
        letter-spacing: 0.12em;
      }

      p {
        color: #b9b3aa;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.25rem;
        border-radius: 0.55rem;
        background: linear-gradient(135deg, #d69a55, #9d5c20);
        color: #080706;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
